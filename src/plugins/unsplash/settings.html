<div class="form-group">
    <label for="search_query" class="form-label">搜索关键词：</label>
    <input type="text" id="search_query" name="search_query" placeholder="请输入…" class="form-input">
    <small style="width: 100%; color: var(--text-primary);">Optional: Search for an image on Unsplash. If not provided, a random image will be fetched.</small>
</div>

<div class="form-group">
    <label for="collections" class="form-label">合集：</label>
    <input type="text" id="collections" name="collections" placeholder="e.g. 1234,5678" class="form-input">
    <small style="width: 100%; color: var(--text-primary);">可选：逗号分隔的 Unsplash 合集 ID 列表。</small>
</div>

<div class="form-group">
    <div class="form-group">
        <label for="content_filter" class="form-label">内容过滤：</label>
        <select id="content_filter" name="content_filter" class="form-input">
            <option value="low">排除裸露与暴力</option>
            <option value="high">不过滤</option>
        </select>
    </div>

    <div class="form-group">
        <label for="color" class="form-label">颜色：</label>
        <select id="color" name="color" class="form-input">
            <option value="">任意</option>
            <option value="black_and_white">黑白</option>
            <option value="black">黑色</option>
            <option value="white">白</option>
            <option value="yellow">黄</option>
            <option value="orange">橙</option>
            <option value="red">红</option>
            <option value="purple">紫</option>
            <option value="magenta">洋红</option>
            <option value="green">绿</option>
            <option value="teal">青</option>
            <option value="blue">蓝</option>
        </select>
    </div>

    <div class="form-group">
        <label for="orientation" class="form-label">方向：</label>
        <select id="orientation" name="orientation" class="form-input">
            <option value="">任意</option>
            <option value="landscape">横图</option>
            <option value="portrait">竖图</option>
        </select>
    </div>
</div>

<script>
    // populate form values from plugin settings
    document.addEventListener('DOMContentLoaded', () => {
        if (loadPluginSettings) {
            document.getElementById('search_query').value = pluginSettings.search_query || '';
            document.getElementById('collections').value = pluginSettings.collections || '';
            document.getElementById('content_filter').value = pluginSettings.content_filter || 'low';
            document.getElementById('color').value = pluginSettings.color || '';
            document.getElementById('orientation').value = pluginSettings.orientation || '';
        }
    });
</script>
