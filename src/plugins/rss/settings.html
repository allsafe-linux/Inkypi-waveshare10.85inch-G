<div class="form-group">
    <div class="form-group">
        <label for="title" class="form-label">标题：</label>
        <input type="text" id="title" name="title" placeholder="请输入…" required class="form-input">
    </div>
    <div class="form-group">
        <label for="includeImages" class="form-label">包含图片：</label>
        <div class="toggle-container">
            <input type="checkbox" id="includeImages" name="includeImages" class="toggle-checkbox" value="false"
                onclick="this.value = this.checked ? 'true' : 'false'">
            <label for="includeImages" class="toggle-label"></label>
        </div>
    </div>
    <div class="form-group nowrap">
        <label for="fontSize" class="form-label">字号：</label>
        <select id="fontSize" name="fontSize" class="form-input">
            <option value="x-small">特小</option>
            <option value="small">小</option>
            <option value="normal">普通</option>
            <option value="large">大</option>
            <option value="x-large">特大</option>
        </select>
    </div>
</div>
<div class="form-group">
    <div class="form-group">
        <label for="feedUrl" class="form-label">RSS 订阅地址：</label>
        <input type="text" id="feedUrl" name="feedUrl" placeholder="请输入…" required class="form-input">
    </div>
</div>

<div class="form-group">
    <span style="color: var(--text-primary);">Warning: Do not run with untrusted URLs, as it may pose a security risk.</span>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        let fontSize = "normal";
        if (loadPluginSettings) {
            document.getElementById('title').value = pluginSettings.title || '';
            document.getElementById('includeImages').checked = pluginSettings.includeImages;
            document.getElementById('feedUrl').value = pluginSettings.feedUrl || '';

            fontSize = pluginSettings.fontSize;
        }

        document.getElementById('fontSize').value = fontSize;
    });
</script>
