# Pi Zero 开机二维码配网服务配置
#
# ⚠️⚠️ 热点凭据说明（部署前请务必读）⚠️⚠️
# 本仓库**不提供**任何默认密码 —— 在仓库里写死一个凭据，
# 等于把这个凭据公开给所有能看到这份代码的人。
#   · install_steps.sh 会在安装时**随机生成**一对凭据写进本文件，
#     并在安装结束时打印出来；
#   · 已经有密码时重跑安装脚本会**保留原值**，不会覆盖你改过的凭据；
#   · 手动部署的话，请自己把下面 hotspot_password 填成至少 8 位的随机串。
#
# 留空的后果：守护进程会**拒绝开启热点**（宁可不配网，也不开开放网络），
#             只保留 http://<本机IP>:8765/ 这个网页配网入口。
#
# 另外两种改法（任选其一）：
#   A. 在 InkyPi 网页 /plugin/wifi_setup 里改热点名/密码 →「保存到播放列表」
#      → 网页里存的实例参数**优先于本文件**，立即生效，不用动任何代码；
#   B. 直接改下面这两行的值，然后 sudo systemctl restart wifi-setup.service
#
# 说明：在 InkyPi 网页 (/plugin/wifi_setup) 里改的参数并「保存到播放列表」后，
#       优先级高于本文件；本文件是兜底默认值。

# 手机要连的临时热点名（仅当本机连不上无线网时才会开）
hotspot_ssid=InkyPi-Setup

# 热点密码（WPA2，至少 8 位）—— 留空 = 安装脚本会随机生成
hotspot_password=

# 配网页面端口
setup_port=8765

# 二维码上屏后的配网窗口时长（秒）
window_seconds=30

# 开机后先等 NetworkManager 自动连网的秒数；超过还没连上就走热点配网
lan_wait_seconds=30

# 一轮配网结束后，隔多少秒再检查一次是否需要重新配网
retry_seconds=300

# 等 InkyPi Web 服务就绪的超时（秒）
inkypi_timeout=240

# 配网结束后等多少秒把墨水屏刷回正常内容。
# 墨水屏硬约束：两次刷新至少间隔 180 秒（官方手册），不要低于这个数，否则伤屏/残影。
restore_display_seconds=200
